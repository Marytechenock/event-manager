<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Raffle Setup</title>
  <!-- Shared admin styles (sidebar, layout, fonts) -->
  <link rel="stylesheet" href="css/manage-companies.css">
  <!-- Page-specific styles (raffle form, header, etc.) -->
  <link rel="stylesheet" href="css/raffle-setup.css">
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="admin-container">
    <!-- Mobile Sidebar Toggle -->
    <button class="sidebar-toggle" onclick="toggleSidebar()">
      <i class="fas fa-bars"></i>
    </button>

    <!-- Shared Sidebar (loaded dynamically) -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <div class="admin-main">
      <div class="header-bar">
        <h2 class="header-title">Raffle Setup</h2>
        <div class="header-actions">
          <button class="back-btn" onclick="window.location='admin-dashboard.html'">← Back</button>
        </div>
      </div>

      <div class="container">
        <h1>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8" fill="#ff00ff"/>
            <path d="M12 8l4 4-4 4" stroke="white" stroke-width="2" fill="none"/>
          </svg>
          Raffle Setup
        </h1>

        <!-- Minimal Form: Only Company Name -->
        <form id="raffleForm">
          <div class="form-group">
            <label for="companyName">Company Sponsoring the Raffle</label>
            <input type="text" id="companyName" placeholder="e.g., MaryTechnock Solutions" required>
          </div>
          <button type="submit" class="raffle-btn">Start Raffle</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Load Shared Sidebar -->
  <script>
    // DO NOT CHANGE — keep your existing sidebar logic
    fetch('sidebar.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('sidebar-container').innerHTML = html;
        setActiveMenuItem();
      })
      .catch(err => console.error('Failed to load sidebar:', err));

    function setActiveMenuItem() {
      const currentPage = window.location.pathname.split('/').pop();
      document.querySelectorAll('.menu-item').forEach(item => {
        const href = item.getAttribute('href');
        if (href === currentPage) {
          item.classList.add('active');
        }
      });
    }

    function toggleSidebar() {
      const sidebar = document.querySelector('.sidebar');
      sidebar?.classList.toggle('open');
    }

    function logout() {
      fetch('/api/admin/logout', {
        method: 'POST',
        credentials: 'same-origin'
      }).finally(() => {
        window.location.href = 'admin-login.html';
      });
    }

    document.addEventListener('click', function(e) {
      const sidebar = document.querySelector('.sidebar');
      const toggle = document.querySelector('.sidebar-toggle');
      if (window.innerWidth <= 1024 && sidebar && !sidebar.contains(e.target) && !toggle?.contains(e.target)) {
        sidebar.classList.remove('open');
      }
    });
  </script>

  <!-- Minimal Form Logic -->
  <script>
    document.getElementById('raffleForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const company = document.getElementById('companyName').value.trim();
      if (!company) {
        alert('Please enter the sponsoring company name.');
        return;
      }

      // Pass company name to next page via URL
      const url = `raffle-wheel.html?company=${encodeURIComponent(company)}`;
      window.location.href = url;
    });
  </script>
</body>
</html>
