<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Companies - MAZ Superbrand</title>
    <link rel="stylesheet" href="css/manage-companies.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar Toggle for Mobile -->
        <button class="sidebar-toggle" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>

        <!-- SIDEBAR WILL BE LOADED HERE -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <div class="admin-main">
            <!-- Page Header -->
            <div class="page-header">
                <div class="page-title-section">
                    <h1 class="admin-title">Manage Companies</h1>
                    <div class="admin-subtitle">Assign tables and manage company allocations</div>
                </div>
                <div class="user-info">
                    <div style="text-align: right; color: var(--text-light);">
                        <div>Welcome, Admin</div>
                        <div style="font-size: 0.9em; color: var(--text-light);">Superbrand Awards 2025</div>
                    </div>
                </div>
            </div>

            <!-- Add New Company Card -->
            <div class="add-company-card">
                <h2>Add New Company</h2>
                <form id="addCompanyForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>COMPANY NAME</label>
                            <input type="text" id="companyName" placeholder="e.g., MARYTECHENOCK SOLUTIONS" required>
                        </div>
                        <div class="form-group">
                            <label>TABLE NUMBER</label>
                            <input type="text" id="tableNumber" placeholder="e.g., TABLE 23" required>
                        </div>
                        <div class="form-group">
                            <label>NUMBER OF CHAIRS</label>
                            <input type="number" id="totalChairs" required min="1" value="10">
                        </div>
                    </div>
                    <button type="submit" class="btn-add-company">+ Add Company</button>
                </form>
            </div>

            <!-- Companies Table Section -->
            <div class="companies-table-card">
                <h2>Companies and Tables</h2>
                <div class="table-container">
                    <table class="companies-table">
                        <thead>
                            <tr>
                                <th>Company Name</th>
                                <th>Table Number</th>
                                <th>Total Chairs</th>
                                <th>Occupied</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="companiesList">
                            <!-- Data injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Load shared sidebar & set active item -->
    <script>
        // Load sidebar from external file
        fetch('sidebar.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;
                setActiveMenuItem();
            })
            .catch(err => {
                console.error("Failed to load sidebar:", err);
            });

        // Highlight current page in sidebar
        function setActiveMenuItem() {
            const currentPage = window.location.pathname.split('/').pop();
            const menuItems = document.querySelectorAll('.menu-item');

            menuItems.forEach(item => {
                const href = item.getAttribute('href');
                if (href === currentPage) {
                    item.classList.add('active');
                }
            });
        }

        // Toggle sidebar (mobile)
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            sidebar?.classList.toggle('open');
        }

        // Logout
        function logout() {
            localStorage.removeItem('adminLoggedIn');
            window.location.href = 'admin-login.html';
        }

        // Close sidebar on outside click (mobile only)
        document.addEventListener('click', function(event) {
            const sidebar = document.querySelector('.sidebar');
            const toggleBtn = document.querySelector('.sidebar-toggle');

            if (window.innerWidth <= 1024 &&
                sidebar &&
                !sidebar.contains(event.target) &&
                !toggleBtn?.contains(event.target)) {
                sidebar.classList.remove('open');
            }
        });
    </script>

    <!-- Your existing companies.js -->
    <script src="js/companies.js"></script>
</body>
</html>
