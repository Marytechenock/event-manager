<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Companies - MAZ Superbrand</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar Toggle for Mobile -->
        <button class="sidebar-toggle" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>

        <!-- Sidebar -->
        <div class="admin-sidebar glass-card" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo gold-gradient">MAZ</div>
                <div class="sidebar-subtitle">Admin Portal</div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-item">
                    <a href="admin-dashboard.html" class="nav-link">
                        <i class="fas fa-tachometer-alt"></i>
                        Dashboard
                    </a>
                </div>
                <div class="nav-item">
                    <a href="manage-companies.html" class="nav-link active">
                        <i class="fas fa-building"></i>
                        Manage Companies
                    </a>
                </div>
                <div class="nav-item">
                    <a href="javascript:void(0)" class="nav-link logout" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i>
                        Logout
                    </a>
                </div>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="admin-main">
            <div class="admin-header">
                <div>
                    <h1 class="admin-title">Manage Companies</h1>
                    <div class="admin-subtitle">Assign tables and manage company allocations</div>
                </div>
                <div class="user-info">
                    <div style="text-align: right;">
                        <div>Welcome, Admin</div>
                        <div style="font-size: 0.9em; color: var(--primary-gold);">Superbrand Awards 2025</div>
                    </div>
                </div>
            </div>

            <!-- Add Company Form -->
            <div class="glass-card" style="margin-bottom: 30px;">
                <h2 style="margin-bottom: 25px; color: var(--primary-gold);">Add New Company</h2>
                <form id="addCompanyForm">
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
                        <div class="form-group">
                            <label for="companyName" class="form-label">Company Name *</label>
                            <input type="text" id="companyName" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="tableNumber" class="form-label">Table Number *</label>
                            <input type="text" id="tableNumber" class="form-control" required placeholder="e.g., T1, T2">
                        </div>

                        <div class="form-group">
                            <label for="totalChairs" class="form-label">Number of Chairs *</label>
                            <input type="number" id="totalChairs" class="form-control" required min="1" value="10">
                        </div>
                    </div>

                    <button type="submit" class="btn-luxury" style="margin-top: 20px;">
                        <i class="fas fa-plus"></i> Add Company
                    </button>
                </form>
            </div>

            <!-- Companies List -->
            <div class="glass-card">
                <h2 style="margin-bottom: 25px; color: var(--primary-gold);">Companies & Tables</h2>
                <div id="companiesList" class="company-grid">
                    <!-- Companies will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script src="js/companies.js"></script>
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('open');
        }

        // Close sidebar when clicking outside on mobile
        document.addEventListener('click', function(event) {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.querySelector('.sidebar-toggle');

            if (window.innerWidth <= 1024 &&
                !sidebar.contains(event.target) &&
                !toggleBtn.contains(event.target)) {
                sidebar.classList.remove('open');
            }
        });

        // Logout function
        function logout() {
            localStorage.removeItem('adminLoggedIn');
            window.location.href = 'admin-login.html';
        }
    </script>
</body>
</html>
