<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Successful Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="css/success.css">
</head>
<body>
    <div class="top-logo">
        <img src="/assets/images/top-logo.png" alt="MAZ Superbrand Awards Logo" />
    </div>

    <h1 class="hero-title">
        Registration <br>
        Successful!
    </h1>

    <p class="success-message">
        Thank you for registering for the MAZ <br/>
        <span class="success-mess">Superbrand Awards 2025</span>
    </p>

    <!-- Lucky Number Section -->
    <div class="table-assignment">
        <div class="table-label">Your Lucky Number</div>
        <div class="table-number" id="luckyNumber">###</div>
        <div class="table-instruction">Keep this number for raffle draws!</div>
    </div>

    <!-- Table Assignment Section -->
    <div class="table-assignment">
        <div class="table-label">Your Table Assignment</div>
        <div class="table-number" id="tableNumber">TBD</div>
        <div class="table-instruction">Please proceed to your assigned table</div>
    </div>

    <!-- Download Button -->
    <a id="program-btn" href="downloads/event-program.pdf" class="btn-luxury" target="_blank">
        View and download the event program
    </a>

    <button class="exit-btn" onclick="exitGracefully()">Exit</button>

    <div class="sadc-text">Leading digital transformation in SADC</div>

    <div class="bottom-logo">
        <img src="assets/images/footer-logo.png" />
    </div>

    <script>
        function exitGracefully() {
            window.location.href = 'index.html';
        }

        // Get parameters from URL
        const urlParams = new URLSearchParams(window.location.search);
        const tableNumber = urlParams.get('table');
        const luckyNumber = urlParams.get('lucky');

        // Apply # prefix and update
        if (luckyNumber) {
            document.getElementById('luckyNumber').textContent = '#' + luckyNumber;
        }
        if (tableNumber) {
            document.getElementById('tableNumber').textContent = tableNumber;
        }

        // Confetti
        function startConfetti() {
            const duration = 5 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(() => {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 100 * (timeLeft / duration);
                confetti(
                    Object.assign({}, defaults, {
                        particleCount,
                        origin: { x: randomInRange(0.1, 0.9), y: Math.random() - 0.2 }
                    })
                );
            }, 250);
        }

        window.addEventListener('load', startConfetti);
    </script>
</body>
</html>
