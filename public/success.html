<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Successful Registration</title>
    <!-- Montserrat Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="css/success.css">
    <style>
    </style>
</head>
<body>
    <main class="success-page">
        <div class="top-logo">
            <img src="/assets/images/top-logo.png" alt="MAZ Superbrand Awards Logo" />
        </div>

        <h1 class="hero-title">
            Registration <br>
            Successful!
        </h1>

        <p class="success-message">
            Thank you for registering for the MAZ
            <span class="success-mess">Superbrand Business Banquet 2026</span>
        </p>

        <div class="success-actions">
            <a id="program-btn" href="downloads/Superbrand Banquet 2026 Program.pdf" class="btn-luxury" target="_blank">
                View and download the event program
            </a>

            <button class="exit-btn" onclick="exitGracefully()">Exit</button>
        </div>

        <div class="powered-by-badge" aria-label="Powered by Ecobank">
            <span class="powered-by-label">Powered By</span>
            <img
                src="assets/images/imgbin-ecobank.jpg"
                alt="Ecobank logo"
                class="powered-by-logo"
            />
        </div>
    </main>

    <!-- Confetti Script -->
    <script>
            function exitGracefully() {
                window.location.href = 'index.html';
            }

        // Get table number from URL
        const urlParams = new URLSearchParams(window.location.search);
        const tableNumber = urlParams.get('table');
        const luckyNumber = urlParams.get('lucky');

        // Start confetti on load
        function startConfetti() {
            const duration = 5 * 1000; // 40 seconds
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(() => {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 100 * (timeLeft / duration);
                confetti(
                    Object.assign({}, defaults, {
                        particleCount,
                        origin: { x: randomInRange(0.1, 0.9), y: Math.random() - 0.2 }
                    })
                );
            }, 250);
        }

        // Trigger confetti when page loads
        window.addEventListener('load', startConfetti);


    document.addEventListener('DOMContentLoaded', function() {
        const btn = document.getElementById('program-btn');
        if (btn) {
      // Add flicker class → triggers animation once
        btn.classList.add('flick-5');
    }
  });


    </script>
</body>
</html>
