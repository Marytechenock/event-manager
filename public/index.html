<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User page</title>
    <link rel="stylesheet" href="css/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* Ensure white background and black text */
      
    </style>
</head>
<body>
    <!-- Top Logo Placeholder -->
    <div class="top-logo">
        <img src="assets/images/top-logo.png" alt="Company Logo">
    </div>

    <div class="container">
        <!-- Hero Section -->
        <div class="hero-section">
            <div class="hero-content fade-in-up">
                <h1 class="hero-title">
                    <span class="word">Welcome</span><br>
                    <span class="word">TO</span><br>
                    <span class="word">Superbrand Awards</span><br>
                    <span class="word">2025</span>
                </h1>
      
                <!-- Trophy Image -->
                <div class="trophy-container">
                    <div class="trophy-image">
                        <img src="assets/images/superbrand.png" alt="MAZ Superbrand Trophy" style="width: 100%; height: auto;">
                    </div>
                </div>

                <!-- Call to Action -->
                <div style="margin-top: 0 px;">
                    <a href="register.html" class="btn-luxury">
                        Register
                    </a>
                </div>     
            </div>
        </div>

        <!-- Footer Text and Logo -->
        <div class="footer">
            <div class="footer-logo">
                <img src="assets/images/footer-logo.png" alt="Marytechenock Solutions Logo">
            </div>
            <p>©2025 Marytechenock Solutions</p>
        </div>
    </div>

    <script>
        // Add staggered animation for elements
        document.addEventListener('DOMContentLoaded', function() {
            const elements = document.querySelectorAll('.fade-in-up');
            elements.forEach((element, index) => {
                element.style.animationDelay = `${index * 0.2}s`;
            });
        });
    </script>
</body>
</html>
