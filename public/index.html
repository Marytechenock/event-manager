<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAZ Superbrand Awards 2025</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Brand Header -->
        <div class="brand-header fade-in-up">
            <div class="brand-logo gold-gradient">MAZ</div>
            <div class="brand-subtitle">Superbrand Awards</div>
        </div>

        <!-- Hero Section -->
        <div class="hero-section">
            <div class="hero-content fade-in-up">
                <h1 class="hero-title">
                    Welcome to<br>
                    <span>Superbrands 2025</span>
                </h1>

                <p class="hero-subtitle">SWITCH AWARDS NIGHT</p>

                
              <!-- Trophy Image -->
                <div class="trophy-container">
                    <div class="trophy-image">
                        <img src="assets/images/superbrand.png" alt="MAZ Superbrand Trophy" style="width: 100%; height: auto;">
                    </div>
                </div>

                <!-- Call to Action -->
                <div style="margin-top: 50px;">
                    <a href="register.html" class="btn-luxury">
                        Click to Register
                    </a>
                </div>

                <!-- Event Details -->
                <div class="glass-card" style="margin-top: 60px; padding: 30px;">
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; text-align: center;">
                        <div>
                            <div style="color: var(--primary-gold); font-weight: 600; margin-bottom: 5px;">DATE</div>
                            <div>28th November 2025</div>
                        </div>
                        <div>
                            <div style="color: var(--primary-gold); font-weight: 600; margin-bottom: 5px;">TIME</div>
                            <div>18:30 Hrs</div>
                        </div>
                        <div>
                            <div style="color: var(--primary-gold); font-weight: 600; margin-bottom: 5px;">DRESS CODE</div>
                            <div>Classical Bridgerton</div>
                        </div>
                        <div>
                            <div style="color: var(--primary-gold); font-weight: 600; margin-bottom: 5px;">VENUE</div>
                            <div>Rainbow Towers</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Add staggered animation for elements
        document.addEventListener('DOMContentLoaded', function() {
            const elements = document.querySelectorAll('.fade-in-up');
            elements.forEach((element, index) => {
                element.style.animationDelay = `${index * 0.2}s`;
            });
        });
    </script>
</body>
</html>
