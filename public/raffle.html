<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Raffle Setup</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #081b29;
      margin: 0;
      padding: 0;
      color: #ffffff;
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 250px;
      background: #081b29; 
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      padding: 20px 0;
      box-shadow: 2px 0 10px rgba(0,0,0,0.3);
      z-index: 100;
      display: flex;
      flex-direction: column;
    }

    .sidebar-logo {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .sidebar-logo img {
      width: 220px;
      height: 100px;
      object-fit: cover;
      background: transparent;
    }

    .sidebar-logo h3 {
      margin: 10px 0 0;
      font-size: 16px;
      font-weight: 500;
      color: #ffffff;
    }

    

    .sidebar-menu {
      list-style: none;
      padding: 0;
      margin: 20px 0;
      flex-grow: 1;
    }

    .sidebar-menu li {
      padding: 12px 20px;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ffffff;
      text-decoration: none; 
    }

    .sidebar-menu li:hover {
      background: rgba(255,255,255,0.1);
    }

    .sidebar-menu li.active {
      background: rgba(52, 152, 219, 0.2);
      border-left: 4px solid #3498db;
    }

    .sidebar-menu svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .sidebar-menu a {
      color: inherit;
      text-decoration: none; 
      display: block;
    }

    .sidebar-menu .logout {
      color: #dc3545;
    }

    .sidebar-menu .logout:hover {
      background: rgba(220, 53, 69, 0.2);
      color: #dc3545;
    }

    .main-content {
      margin-left: 250px;
      width: calc(100% - 250px);
      padding: 20px;
      overflow-y: auto;
      background: #081b29;
    }

    .header-bar {
      background: #2c3e50; 
      padding: 15px 20px;
      font-size: 20px;
      font-weight: 600;
      color: white;
      border-radius: 8px 8px 0 0;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title {
      margin: 0;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .back-btn {
      padding: 8px 16px;
      background: rgba(255,255,255,0.2);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.2s ease;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.3);
    }

    .container {
      max-width: 500px;
      margin: 40px auto 0;
      background: #121a22; 
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 25px #0ef;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: white;
      text-align: center;
    }

    h1 {
      color: #ffffff;
      margin-bottom: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    h1 svg {
      width: 30px;
      height: 30px;
      fill: #ff00ff;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #ffffff;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 2px solid gray;
      border-radius: 8px;
      box-sizing: border-box;
      background-color: rgba(52, 73, 94, 0.3);
      color: #ffffff;
      transition: border-color 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: #3498db;
      box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
    }

    button[type="submit"] {
      width: 100%;
      padding: 12px 20px;
      font-size: 16px;
      background: #0099ff;
      color: white;
      border: 2px solid #0ef;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s ease;
      margin-top: 10px;
      box-shadow: 0 0 10px rgba(0,255,255,0.5);
    }

    button[type="submit"]:hover {
      background: linear-gradient(to right, #00ccff, #0099ff);
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-logo">
      <img src="assets/logo.png" alt="Logo">
    </div>


    <ul class="sidebar-menu">
      <li>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 10h-2V7h2v6zm4 0h-2V7h2v6z"/>
        </svg>
        <a href="admin-dashboard.html">Overview</a>
      </li>
      <li>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
        <a href="manage-companies.html">Manage Companies</a>
      </li>
      <li class="active">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M20 4H4v2h16V4zm0 10v-2c0-2.67-4-4-4-4H8c0 0-4 1.33-4 4v2H2v2h2v4h16v-4h2v-2h-2zm-8 4H8v-4h8v4zm0-6c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3z"/>
        </svg>
        <a href="#">Raffle Selection</a>
      </li>
      <li class="logout">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
        </svg>
        <a href="admin-login.html">Logout</a>
      </li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="header-bar">
      <h2 class="header-title">Raffle Setup</h2>
      <div class="header-actions">
        <button class="back-btn" onclick="window.location='admin-dashboard.html'">← Back</button>
      </div>
    </div>

    <div class="container">
      <h1>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8" fill="#ff00ff"/>
          <path d="M12 8l4 4-4 4" stroke="white" stroke-width="2" fill="none"/>
        </svg>
        Raffle Setup
      </h1>
      <form id="raffleForm">
        <div class="form-group">
          <label for="companyName">Company Sponsoring the Raffle</label>
          <input type="text" id="companyName" placeholder="e.g., MaryTechnock" required>
        </div>
        <div class="form-group">
          <label for="totalTickets">Number of Tickets Issued (Participants)</label>
          <input type="number" id="totalTickets" min="1" value="10" required>
        </div>
        <button type="submit">Start Raffle</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('raffleForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const company = document.getElementById('companyName').value.trim();
      const tickets = document.getElementById('totalTickets').value;
      
      if (!company || isNaN(tickets) || tickets < 1) {
        alert("Please enter a valid company name and number of tickets.");
        return;
      }
      
      const url = `raffle-wheel.html?company=${encodeURIComponent(company)}&tickets=${tickets}`;
      window.location.href = url;
    });
  </script>
</body>
</html>
