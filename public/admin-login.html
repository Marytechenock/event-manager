<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - MAZ Superbrand Event</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="welcome-header">
            <h1 class="gold-gradient">MAZ Event Admin</h1>
            <p>SWITCH AWARDS NIGHT Management Portal</p>
        </div>

        <div class="card" style="max-width: 400px; margin: 0 auto;">
            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" required value="admin">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" required value="admin123">
                </div>

                <button type="submit" class="btn-gold" style="width: 100%;">
                    Login to Admin Portal
                </button>
            </form>

            <div style="margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 8px;">
                <p style="margin: 0; font-size: 0.9em; opacity: 0.8;">
                    <strong>Default Credentials:</strong><br>
                    Username: admin<br>
                    Password: admin123
                </p>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
