<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="css/register.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Top Logo - centered at top of page -->
    <div class="top-logo-section">
        <img src="/assets/images/super.png" alt="MAZ Superbrand Awards Logo">
    </div>

    <div class="container">
        <div class="hero-section">
            <div class="luxury-form glass-card">
                <form id="registrationForm" method="post">
                    <div class="form-group">
                        <label for="name" class="form-label">First Name *</label>
                        <input type="text" id="name" name="name" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="surname" class="form-label">Last Name *</label>
                        <input type="text" id="surname" name="surname" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Email Address *</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="phone" class="form-label">Phone Number *</label>
                        <input type="tel" id="phone" name="phone" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="organisation-name" class="form-label">Organisation Name *</label>
                        <input
                            type="text"
                            id="organisation-name"
                            name="organisation_name"
                            class="form-control"
                            placeholder="Enter organisation name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="position" class="form-label">Position *</label>
                        <input type="text" id="position" name="position" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <button type="submit" class="btn-luxury">
                            Submit
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bottom attribution + logo -->
    <div class="mary">
         <p>Marytechenock Solutions Technology Advisory Consultant Company for MAZ</p>
    </div>
    <div class="top-logo-section">
        <div class="maryt">
            <img src="/assets/images/footer-logo.png" alt="Marytechenock Solutions Logo">
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
