<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - MAZ Superbrand Awards</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Brand Header -->
        <div class="brand-header">
            <div class="brand-logo gold-gradient">MAZ</div>
            <div class="brand-subtitle">Event Registration</div>
        </div>

        <!-- Registration Form -->
        <div class="hero-section">
            <div class="luxury-form glass-card" style="padding: 50px;">
                <h2 style="text-align: center; margin-bottom: 40px; font-size: 2.2em;">Guest Registration</h2>

                <form id="registrationForm">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="form-group">
                            <label for="name" class="form-label">First Name *</label>
                            <input type="text" id="name" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="surname" class="form-label">Last Name *</label>
                            <input type="text" id="surname" class="form-control" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Email Address *</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="phone" class="form-label">Phone Number *</label>
                        <input type="tel" id="phone" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="company" class="form-label">Company *</label>
                        <select id="company" class="form-control" required>
                            <option value="">Select your company</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="position" class="form-label">Position *</label>
                        <input type="text" id="position" class="form-control" required>
                    </div>

                    <button type="submit" class="btn-luxury" style="width: 100%; margin-top: 20px;">
                        Complete Registration
                    </button>
                </form>

                <div style="text-align: center; margin-top: 30px;">
                    <a href="index.html" class="btn-outline-gold">
                        ← Back to Welcome
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
