<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Raffle Wheel</title>
  <link rel="stylesheet" href="css/raffle.css">
</head>
<body>
  <div class="container">
    <button class="exit-btn" onclick="window.location='raffle-setup.html'" title="Exit">x</button>

    <h1>Raffle Wheel</h1>

    <div class="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheel" width="500" height="500"></canvas>
    </div>

    <div style="text-align: center;">
      <button id="drawBtn" onclick="drawWinner()">Draw Winner</button>
      <button id="resetBtn" onclick="resetRaffle()">Reset</button>
    </div>

    <div class="winner-display" id="winnerDisplay">-</div>

    <div id="winners">
      <strong>Winners so far:</strong>
      <div id="winnerList"></div>
    </div>
  </div>

  <div id="winnerModal">
    <div id="modalContent">
      <div id="modalSponsorHeader">Sponsored by: <span id="modalSponsorName">Loading...</span></div>

      <div class="trophy">🏆</div>
      <h1 id="winnerNumber">1</h1>
      <div id="congratsText">Congratulations!</div>
      <button id="closeModalBtn" onclick="closeWinnerModal()">Close</button>
    </div>
  </div>
  <script src="js/raffle.js"></script>
</body>
</html>
